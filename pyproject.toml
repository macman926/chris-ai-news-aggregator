[project]
name = "chris-ai-news-aggregator"
version = "0.1.0"
description = "AI news aggregator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg2-binary",
    "httpx",
    "feedparser",
    "beautifulsoup4",
    "lxml",
    "html2text",
    "anthropic",
    "pydantic-settings",
    "python-dotenv",
]

[project.scripts]
chris-ai-news-aggregator = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
include = ["main.py"]
